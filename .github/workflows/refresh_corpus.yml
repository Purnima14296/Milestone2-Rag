name: Refresh corpus

on:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "config/**"
      - "scripts/**"
      - "src/mf_faq_assistant/phase1_ingestion/**"
      - "requirements.txt"
      - ".github/workflows/refresh_corpus.yml"

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Refresh corpus (Phases 1.1–1.7)
        env:
          PYTHONPATH: src
        run: python scripts/refresh_corpus.py

      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -q

      - name: Drift check
        env:
          PYTHONPATH: src
        run: python scripts/run_drift_check.py

      - name: Golden eval
        env:
          PYTHONPATH: src
        run: python scripts/run_eval.py

      - name: Upload active index artifact
        uses: actions/upload-artifact@v4
        with:
          name: mf-faq-index
          path: data/index/active/
          retention-days: 30

      - name: Upload refresh report artifact
        uses: actions/upload-artifact@v4
        with:
          name: mf-faq-refresh-report
          path: data/refresh/refresh_report.json
          retention-days: 30
          if-no-files-found: ignore
