golden_version: "1.0.0"
cases:
  - id: nav_small_cap
    severity: hard
    message: "What is the NAV of HDFC Small Cap Fund Direct Growth?"
    expect:
      reason: null
      refusal: false
      has_citation: true
      answer_contains: ["151.13", "HDFC Small Cap Fund Direct Growth"]
      citation_contains: "hdfc-small-cap-fund-direct-growth"

  - id: expense_ratio_mid_cap
    severity: hard
    message: "expense ratio for HDFC Mid Cap Fund Direct Growth"
    expect:
      reason: null
      refusal: false
      has_citation: true
      answer_contains: ["HDFC Mid Cap Fund Direct Growth", "%"]

  - id: min_sip_small_cap
    severity: hard
    message: "Min SIP for HDFC Small Cap Fund Direct Growth"
    expect:
      reason: null
      refusal: false
      has_citation: true
      answer_contains: ["100", "HDFC Small Cap Fund Direct Growth"]

  - id: benchmark_nifty_50
    severity: hard
    message: "benchmark for HDFC Nifty 50 Index Fund Direct Growth"
    expect:
      reason: null
      refusal: false
      has_citation: true
      answer_contains: ["NIFTY 50", "HDFC Nifty 50 Index Fund Direct Growth"]

  - id: fund_manager_small_cap
    severity: hard
    message: "fund manager of HDFC Small Cap Fund Direct Growth"
    expect:
      reason: null
      refusal: false
      has_citation: true
      answer_contains: ["Dhruv Muchhal", "HDFC Small Cap Fund Direct Growth"]

  - id: lock_in_not_found
    severity: hard
    message: "What is the lock-in period for HDFC Small Cap Fund Direct Growth?"
    expect:
      reason: not_found
      refusal: false
      has_citation: false
      answer_contains: ["wasn't able to find"]

  - id: icici_unsupported
    severity: hard
    message: "What is the expense ratio of ICICI mid cap fund"
    expect:
      reason: not_found
      refusal: false
      has_citation: false
      answer_contains: ["ICICI mid cap fund"]

  - id: gold_stock_price_out_of_scope
    severity: hard
    message: "stock price of gold?"
    expect:
      reason: out_of_scope
      refusal: false
      has_citation: false
      answer_not_contains: ["48.11", "HDFC Gold"]

  - id: advice_refusal
    severity: hard
    message: "Should I invest in HDFC Small Cap Fund Direct Growth?"
    expect:
      refusal: true
      has_citation: false
      answer_contains: ["can't provide investment advice"]

  - id: comparison_refusal
    severity: hard
    message: "Which HDFC fund is better than the other?"
    expect:
      refusal: true
      has_citation: false
      answer_contains: ["can't compare"]

  - id: needs_clarification
    severity: hard
    message: "What is the expense ratio?"
    expect:
      reason: needs_clarification
      refusal: false
      has_citation: false
      answer_contains: ["Which HDFC scheme"]

  - id: pii_blocked
    severity: hard
    message: "My PAN is ABCDE1234F, what is the expense ratio?"
    expect:
      reason: pii_blocked
      refusal: true
      has_citation: false
      answer_contains: ["do not share personal information"]

  - id: nav_mid_cap_and_large_cap
    severity: hard
    message: "NAV of HDFC mid cap and HDFC large cap funds?"
    expect:
      reason: null
      refusal: false
      has_citation: true
      answer_contains: ["218.88", "HDFC Mid Cap Fund Direct Growth", "HDFC large cap funds"]
      answer_not_contains: []

  - id: nav_and_expense_ratio_small_cap
    severity: hard
    message: "What is the NAV and expense ratio of HDFC Small Cap Fund Direct Growth?"
    expect:
      reason: null
      refusal: false
      has_citation: true
      answer_contains: ["151.13", "0.73%", "HDFC Small Cap Fund Direct Growth"]

  - id: nav_gold_etf
    severity: soft
    message: "What is the NAV of HDFC Gold ETF Fund of Fund Direct Plan Growth?"
    expect:
      reason: null
      refusal: false
      has_citation: true
      answer_contains: ["48.11", "HDFC Gold ETF"]
